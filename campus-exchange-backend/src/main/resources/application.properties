spring.application.name=CampusExchange

# 服务器端口配置
server.port=8080

# Spring Datasource Configuration (数据源配置)
# 数据库连接 URL
# - localhost:3306: 本地 MySQL 服务器及端口
# - campus_exchange_db: 数据库名称
# - useUnicode=true&characterEncoding=utf8: 使用Unicode编码
# - serverTimezone=Asia/Shanghai: 时区设置, 避免因为时区不匹配导致的时间差异问题 (非常重要!)
# - allowPublicKeyRetrieval=true&useSSL=false: MySQL 8+ 版本需要这些参数来处理 SSL 连接设置 (本地开发 MySQL 无需 SSL)
spring.datasource.url=jdbc:mysql://localhost:3306/campus_exchange_sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

# 数据库用户名 (开发环境通常使用本地账户, 例如 root 或 root)
spring.datasource.username=root

# 数据库密码 (记得在生产环境中修改!)
spring.datasource.password=123456

# 数据库驱动类名 (针对 MySQL 8+ 版本)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus Configuration (配置选项, 可选)
# 开启控制台打印 SQL 语句, 便于调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# MyBatis-Plus mapper 扫描配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=org.campusmarket.exchange.entity
mybatis-plus.global-config.db-config.id-type=AUTO
mybatis-plus.global-config.banner=false

# 调试设置
logging.level.org.springframework=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.com.baomidou.mybatisplus=DEBUG

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# 自定义文件上传配置
file.upload.path=E:/soft_ware/idea_projects/CampusExchange/upload
file.upload.max-size=10485760
file.upload.domain=http://localhost